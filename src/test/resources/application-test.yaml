spring:
  datasource:
    url: jdbc:h2:mem:dogether;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    issuer: dogether-test
    secret: test-secret-key-must-be-at-least-32-bytes-long
    access-ttl: 30m
    refresh-ttl: 7d
  cors:
    allowed-origins:
      - http://localhost:3000
  s3:
    bucket: dogether-test
    region: ap-northeast-2
    endpoint:
    presign-endpoint:
    path-style-access-enabled: false
  media:
    upload-url-ttl: 15m
    view-url-ttl: 10m
    delete-grace: 5m
    max-upload-bytes: 10485760
    maintenance-delay: 1h
  bootstrap-admin:
    enabled: false
