spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  datasource:
    url: jdbc:h2:mem:dogether;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092

app:
  setlog-upload:
    require-version-id: false
  jwt:
    issuer: dogether-test
    secret: test-secret-key-must-be-at-least-32-bytes-long
    access-ttl: 30m
    refresh-ttl: 7d
  cors:
    allowed-origins:
      - http://localhost:3000
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: dogether-test
    region: ap-northeast-2
    presigned-url-expiration-seconds: 600
    endpoint:
    presign-endpoint:
    path-style-access-enabled: false
    allow-insecure-endpoint: false
  media:
    upload-url-ttl: 15m
    view-url-ttl: 10m
    max-upload-bytes: 10485760
    maintenance-delay: 1h
  bootstrap-admin:
    enabled: false
  redis:
    host: localhost
    port: 6379
  email-verification:
    hmac-secret: test-email-verification-hmac-secret-at-least-32-bytes
    worker-enabled: false
    sender-mode: fake
    challenge-ttl: 5m
    token-ttl: 15m
    cooldown: 60s
    payload-ttl: 5m
    stream-key: dogether:email:v1:delivery:stream
    stream-group: email-delivery
    stream-consumer: test-email-worker
    max-attempts: 5
  chat-room:
    lifecycle:
      enabled: false
      maintenance-delay-ms: 60000
      batch-size: 100
      archive-after-days: 30
  storage-cleanup:
    enabled: false
    batch-size: 50
    lease: 5m
    max-attempts: 10
    delay-ms: 60000
    max-upload-duration: 20m
    upload-settle-grace: 30m
    base-backoff: 30s
    max-backoff: 6h
  risk:
    outbox-relay:
      enabled: false
      delay-ms: 1000
      batch-size: 50
      lease: 1m
      send-timeout: 10s
      max-block: 5s
      max-attempts: 10
      base-backoff: 5s
      max-backoff: 10m
    consumer:
      enabled: false
      group-id: dogether-risk-signal-test-v1
      concurrency: 1
      max-poll-records: 100
      max-attempts: 3
      retry-backoff: 10ms
      dlt-topic: risk-signal-topic.DLT
      dlt-publish-timeout: 5s
      max-future-skew: 5m
      max-aggregation-range: 90d
