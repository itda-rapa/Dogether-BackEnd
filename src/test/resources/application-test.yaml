spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  datasource:
    url: jdbc:h2:mem:dogether;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092

app:
  jwt:
    issuer: dogether-test
    secret: test-secret-key-must-be-at-least-32-bytes-long
    access-ttl: 30m
    refresh-ttl: 7d
  cors:
    allowed-origins:
      - http://localhost:3000
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: dogether-test
    region: ap-northeast-2
    presigned-url-expiration-seconds: 600
    endpoint:
    presign-endpoint:
    path-style-access-enabled: false
  media:
    upload-url-ttl: 15m
    view-url-ttl: 10m
    max-upload-bytes: 10485760
    maintenance-delay: 1h
  bootstrap-admin:
    enabled: false
  redis:
    host: localhost
    port: 6379
