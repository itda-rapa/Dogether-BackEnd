spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dogether}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations:
      - classpath:db/migration
      - classpath:db/seed
      - classpath:db/demo

app:
  s3:
    # Spring imports local .env values, while the AWS SDK default credential
    # chain only reads process-level environment variables. Bridge the local
    # RustFS credentials explicitly without changing the production contract.
    access-key: ${AWS_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
    secret-key: ${AWS_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
  email-verification:
    worker-enabled: ${EMAIL_VERIFICATION_WORKER_ENABLED:false}
