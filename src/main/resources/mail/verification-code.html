<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dogether 이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#f0fdfa; font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    Dogether 인증번호를 확인해주세요. {{EXPIRY_TEXT}} 내에 입력하지 않으면 만료됩니다.
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0fdfa; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:20px; border:1px solid #cbe9e3; overflow:hidden;">
          <tr>
            <td align="center" style="padding:40px 32px 8px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td valign="middle" style="padding-right:8px;">
                    <img src="cid:dogetherLogo" width="24" height="24" alt="Dogether" style="display:block;">
                  </td>
                  <td valign="middle">
                    <span style="font-size:20px; font-weight:700; color:#0f766e;">Dogether</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 32px 0 32px;">
              <h1 style="margin:0; font-size:20px; line-height:1.4; color:#0f172a; font-weight:700;">이메일 인증번호</h1>
              <p style="margin:10px 0 0 0; font-size:14px; line-height:1.6; color:#475569;">{{PURPOSE_MESSAGE}}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 32px 4px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f0fdfa; border:1px solid #cbe9e3; border-radius:14px;">
                <tr>
                  <td align="center" style="padding:24px 16px;">
                    <div style="font-size:34px; font-weight:800; letter-spacing:0.28em; color:#0f766e; font-family:'Courier New',monospace;">{{VERIFICATION_CODE}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 32px 0 32px;">
              <p style="margin:0; font-size:13px; line-height:1.6; color:#475569;">
                이 인증번호는 <strong style="color:#0f172a;">{{EXPIRY_TEXT}}간</strong> 유효합니다.<br>
                본인이 요청하지 않았다면 이 메일을 무시해주세요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 0 32px;"><div style="border-top:1px solid #e6f4f1;"></div></td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px 36px 32px;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#94a3b8;">
                본 메일은 발신 전용입니다. 문의사항은 앱 내 고객센터를 이용해주세요.<br>
                &copy; Dogether. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
