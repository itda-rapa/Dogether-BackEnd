spring:
  config:
    # Application 구동 시 .env.production 파일이 자동으로 적용
    import: optional:file:.env[.properties]
  application:
    name: dogether
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs # api-docs의 엔드포인트 지정 : localhost:8080/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: list
    persist-authorization: true


app:
  meeting-card:
    ai:
      base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
      timeout: ${AI_TIMEOUT:5s}
  setlog-upload:
    require-version-id: ${SETLOG_UPLOAD_REQUIRE_VERSION_ID:true}
  jwt:
    issuer: ${JWT_ISSUER:dogether}
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
      success-callback-uri: ${GOOGLE_OAUTH_SUCCESS_CALLBACK_URI:}
      error-callback-uri: ${GOOGLE_OAUTH_ERROR_CALLBACK_URI:}
      allowed-callback-urls: ${GOOGLE_OAUTH_ALLOWED_CALLBACK_URLS:}
      transaction-ttl: ${GOOGLE_OAUTH_TRANSACTION_TTL:5m}
      transaction-grace-ttl: ${GOOGLE_OAUTH_TRANSACTION_GRACE_TTL:1m}
      connect-timeout: ${GOOGLE_OAUTH_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_OAUTH_READ_TIMEOUT:5s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  websocket:
    enabled: ${WEBSOCKET_ENABLED:false}
    heartbeat-send: 10s
    heartbeat-receive: 10s
    message-size-limit: 32KB
  s3:
    # Credentials use the AWS SDK default chain, including AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN) and IAM workload roles.
    # Legacy AWS_S3_* names remain a one-release compatibility fallback.
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:${AWS_S3_BUCKET_NAME}}
    region: ${AWS_REGION}
    presigned-url-expiration-seconds: ${PRESIGNEDURL_EXPIRATION_TIME_SEC}
    endpoint: ${S3_ENDPOINT:}
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:}
    path-style-access-enabled: ${S3_PATH_STYLE:false}
    allow-insecure-endpoint: ${S3_ALLOW_INSECURE_ENDPOINT:false}
  media:
    upload-url-ttl: ${MEDIA_UPLOAD_URL_TTL:15m}
    view-url-ttl: ${MEDIA_VIEW_URL_TTL:10m}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:10485760}
    maintenance-delay: ${MEDIA_MAINTENANCE_DELAY:1m}
  storage-cleanup:
    enabled: ${STORAGE_CLEANUP_ENABLED:true}
    delay-ms: ${STORAGE_CLEANUP_DELAY_MS:60000}
    batch-size: ${STORAGE_CLEANUP_BATCH_SIZE:50}
    lease: ${STORAGE_CLEANUP_LEASE:5m}
    max-attempts: ${STORAGE_CLEANUP_MAX_ATTEMPTS:10}
    max-upload-duration: ${STORAGE_CLEANUP_MAX_UPLOAD_DURATION:20m}
    upload-settle-grace: ${STORAGE_CLEANUP_UPLOAD_SETTLE_GRACE:30m}
    base-backoff: ${STORAGE_CLEANUP_BASE_BACKOFF:30s}
    max-backoff: ${STORAGE_CLEANUP_MAX_BACKOFF:6h}
  risk:
    outbox-relay:
      enabled: ${RISK_SIGNAL_OUTBOX_RELAY_ENABLED:false}
      delay-ms: ${RISK_SIGNAL_OUTBOX_RELAY_DELAY_MS:1000}
      batch-size: ${RISK_SIGNAL_OUTBOX_RELAY_BATCH_SIZE:50}
      lease: ${RISK_SIGNAL_OUTBOX_RELAY_LEASE:1m}
      send-timeout: ${RISK_SIGNAL_OUTBOX_RELAY_SEND_TIMEOUT:10s}
      max-block: ${RISK_SIGNAL_OUTBOX_RELAY_MAX_BLOCK:5s}
      max-attempts: ${RISK_SIGNAL_OUTBOX_RELAY_MAX_ATTEMPTS:10}
      base-backoff: ${RISK_SIGNAL_OUTBOX_RELAY_BASE_BACKOFF:5s}
      max-backoff: ${RISK_SIGNAL_OUTBOX_RELAY_MAX_BACKOFF:10m}
    consumer:
      enabled: ${RISK_SIGNAL_CONSUMER_ENABLED:false}
      group-id: ${RISK_SIGNAL_CONSUMER_GROUP_ID:dogether-risk-signal-v1}
      concurrency: ${RISK_SIGNAL_CONSUMER_CONCURRENCY:1}
      max-poll-records: ${RISK_SIGNAL_CONSUMER_MAX_POLL_RECORDS:100}
      max-attempts: ${RISK_SIGNAL_CONSUMER_MAX_ATTEMPTS:3}
      retry-backoff: ${RISK_SIGNAL_CONSUMER_RETRY_BACKOFF:1s}
      dlt-topic: ${RISK_SIGNAL_CONSUMER_DLT_TOPIC:risk-signal-topic.DLT}
      dlt-publish-timeout: ${RISK_SIGNAL_CONSUMER_DLT_PUBLISH_TIMEOUT:10s}
      max-future-skew: ${RISK_SIGNAL_MAX_FUTURE_SKEW:5m}
      max-aggregation-range: ${RISK_SIGNAL_MAX_AGGREGATION_RANGE:90d}
  safety:
    evaluator:
      enabled: ${SAFETY_EVALUATOR_ENABLED:false}
      threshold: ${SAFETY_EVALUATOR_THRESHOLD:}
      window: ${SAFETY_EVALUATOR_WINDOW:}
      policy-version: ${SAFETY_EVALUATOR_POLICY_VERSION:}
      batch-size: ${SAFETY_EVALUATOR_BATCH_SIZE:50}
      delay-ms: ${SAFETY_EVALUATOR_DELAY_MS:5000}
      lease: ${SAFETY_EVALUATOR_LEASE:1m}
      max-attempts: ${SAFETY_EVALUATOR_MAX_ATTEMPTS:10}
      base-backoff: ${SAFETY_EVALUATOR_BASE_BACKOFF:5s}
      max-backoff: ${SAFETY_EVALUATOR_MAX_BACKOFF:10m}
  bootstrap-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    nickname: ${INITIAL_ADMIN_NICKNAME:}
    neighborhood-code: ${INITIAL_ADMIN_NEIGHBORHOOD_CODE:}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  email-verification:
    hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET}
    challenge-ttl: ${EMAIL_VERIFICATION_CHALLENGE_TTL:5m}
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:15m}
    cooldown: ${EMAIL_VERIFICATION_COOLDOWN:60s}
    payload-ttl: ${EMAIL_VERIFICATION_PAYLOAD_TTL:5m}
    worker-enabled: ${EMAIL_VERIFICATION_WORKER_ENABLED:false}
    sender-mode: ${EMAIL_VERIFICATION_SENDER_MODE:fake}
    stream-key: ${EMAIL_STREAM_KEY:dogether:email:v1:delivery:stream}
    stream-group: ${EMAIL_STREAM_GROUP:email-delivery}
    stream-consumer: ${EMAIL_STREAM_CONSUMER:email-worker-1}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
  pet-verification:
    hmac-secret: ${PET_VERIFICATION_HMAC_SECRET:}
    service-key: ${PET_VERIFICATION_SERVICE_KEY:}
    token-ttl: ${PET_VERIFICATION_TOKEN_TTL:15m}
    connect-timeout: ${PET_VERIFICATION_CONNECT_TIMEOUT:3s}
    read-timeout: ${PET_VERIFICATION_READ_TIMEOUT:5s}
  chat-room:
    lifecycle:
      enabled: ${CHAT_ROOM_LIFECYCLE_ENABLED:true}
      maintenance-delay-ms: ${CHAT_ROOM_LIFECYCLE_MAINTENANCE_DELAY_MS:60000}
      batch-size: ${CHAT_ROOM_LIFECYCLE_BATCH_SIZE:100}
      archive-after-days: ${CHAT_ROOM_LIFECYCLE_ARCHIVE_AFTER_DAYS:30}
