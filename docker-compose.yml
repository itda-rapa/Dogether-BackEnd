services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dogether-backend:local
    container_name: dogether-backend
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dogether
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}

      S3_ENDPOINT: http://rustfs:9000
      S3_PRESIGN_ENDPOINT: http://localhost:${RUSTFS_API_PORT:-9000}
      S3_PATH_STYLE: "true"
      S3_ALLOW_INSECURE_ENDPOINT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    stop_grace_period: 30s

  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: dogether-postgres
    environment:
      POSTGRES_DB: dogether
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dogether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rustfs:
    image: ${RUSTFS_IMAGE}
    container_name: dogether_rustfs
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dogether-rustfs-data:/data
      - dogether-rustfs-logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  dogether-postgres-data:
  dogether-rustfs-data:
  dogether-rustfs-logs:
