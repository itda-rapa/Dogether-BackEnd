services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dogether-backend:local
    container_name: dogether-backend
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dogether
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: dogether-postgres
    environment:
      POSTGRES_DB: dogether
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dogether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  dogether-postgres-data:
