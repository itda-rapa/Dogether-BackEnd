openapi: 3.1.0
info:
  title: 같이놀개 M1 API
  version: 1.3.1-m1
  description: |
    최신 제품 정책과 M1 통합 ERD를 기준으로 작성한 정적 REST 계약 정본이다.
    런타임 /v3/api-docs는 현재 구현 관찰용이며 계약 정본이나 필수 CI Gate가 아니다.
    M1은 폴링 방식이며 WebSocket, Push, 읽음 표시, 메시지 수정·삭제,
    사용자 셋로그 업로드, 회원탈퇴, 욕설 자동 차단 및 AI 대화 검열을 제공하지 않는다.
    최상위 bearerAuth가 적용되는 모든 operation은 인증 실패 시
    401 ErrorEnvelope를 반환한다.
    별도 HTTP Status는 이 정적 계약을 먼저 변경하고 ErrorCode·구현·테스트를 같은
    PR에서 동기화한다. 소유권 실패는 기본 403이며 존재 은닉이 필요한 endpoint만
    명시적으로 404를 사용한다.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Neighborhood
  - name: Auth
  - name: Me
  - name: Pet
  - name: PetVerification
  - name: Setlog
  - name: Greeting
  - name: Friend
  - name: Chat
  - name: MeetingCard
  - name: Block
  - name: Report
  - name: Admin

paths:
  /neighborhoods:
    get:
      tags: [Neighborhood]
      summary: 가입 가능한 동네 목록
      operationId: listNeighborhoods
      security: []
      responses:
        '200':
          description: 활성 동네 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborhoodListEnvelope'

  /auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      operationId: signup
      description: 이메일 인증 없이 가입하며 동네를 직접 선택한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: 가입 및 토큰 발급 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 로그인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh Token 회전
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 토큰 회전 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      description: 현재 사용자의 활성 Refresh Token을 모두 폐기한다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: 로그아웃 완료

  /oauth2/authorization/google:
    get:
      tags: [Auth]
      summary: Google OAuth 브라우저 인증 시작
      operationId: startGoogleOAuthAuthorization
      description: |
        JSON API가 아닌 browser navigation endpoint다. enabled일 때 Google authorization URL로 302를
        반환하며 scope는 `openid email`, state·PKCE S256·nonce를 사용한다. 시작 응답은 동일 browser의
        callback을 위해 short-lived `__Host-dogether_oauth_browser_binding` cookie를 `HttpOnly`, `Secure`,
        `SameSite=Lax`, `Path=/` 및 Domain 없이 설정한다. disabled이면 404다.
      security: []
      responses:
        '302':
          description: Google authorization endpoint로 redirect
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Authorization start sets the short-lived browser correlation cookie; safe error redirects do not.
              schema: { type: string }
        '404':
          description: Google OAuth 비활성화

  /login/oauth2/code/google:
    get:
      tags: [Auth]
      summary: Google OAuth 브라우저 callback
      operationId: completeGoogleOAuthCallback
      description: |
        JSON API가 아닌 Google callback endpoint다. 성공은 allowlist된 success callback URL에
        `loginCode`와 `provider=GOOGLE`만 붙여 302한다. 실패는 error callback URL에 allowlist된
        `errorCode`만 붙여 302한다. 허용 errorCode는 `INTERNAL_ERROR`, `OAUTH_STATE_INVALID`,
        `OAUTH_STATE_EXPIRED`, `OAUTH_AUTHORIZATION_DENIED`,
        `OAUTH_IDENTITY_VERIFICATION_FAILED`, `OAUTH_PROVIDER_UNAVAILABLE`다. authorization을 시작한 동일
        browser correlation cookie가 없거나 일치하지 않으면 `OAUTH_STATE_INVALID`로 302하며 transaction을
        소비하지 않는다. Location에는 JWT,
        provider token, verified email, providerSubject, raw provider response를 포함하지 않는다.
      security: []
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Front success 또는 error callback URL로 redirect
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        '404':
          description: Google OAuth 비활성화

  /auth/oauth/exchange:
    post:
      tags: [Auth]
      summary: OAuth loginCode 교환
      operationId: exchangeOAuthLoginCode
      description: Google callback의 1회용 loginCode를 교환한다. 기존 OAuth 계정은 JWT를, 신규 계정은 프로필 완료용 signupToken을 받는다. 미연결 기존 User와 동일 email이면 자동 연결·신규 User 생성 없이 409을 반환하며 loginCode는 소비하지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthExchangeRequest' }
      responses:
        '200':
          description: 기존 OAuth 계정 로그인 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokensEnvelope' }
        '202':
          description: 신규 OAuth 계정의 프로필 입력 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthSignupRequiredEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /auth/oauth/signup:
    post:
      tags: [Auth]
      summary: OAuth 신규 계정 가입 완료
      operationId: signupOAuth
      description: 1회용 signupToken의 검증된 identity로 OAuth 전용 계정을 만들고 JWT를 발급한다. 가입 중 동일 email User가 먼저 생성되는 late race는 전체 transaction을 rollback하고 409 CONCURRENT_UPDATE_CONFLICT를 반환한다. 이후 새 OAuth authorization부터 다시 시작해야 한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthSignupRequest' }
      responses:
        '201':
          description: OAuth 회원가입 및 JWT 발급 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokensEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /me:
    get:
      tags: [Me]
      summary: 내 정보 조회
      operationId: getMe
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
  /me/active-pet:
    put:
      tags: [Me]
      summary: Active Pet 변경
      operationId: selectActivePet
      description: |
        Active Pet이 없는 L1 사용자도 호출할 수 있으며 ACTIVE_PET_REQUIRED를 선행 적용하지 않는다.
        대상은 요청 User가 소유하고 status=ACTIVE, deletedAt=null인 Pet이어야 한다.
        Pet이 없으면 404 PET_NOT_FOUND, 타인 소유면 403 PET_NOT_OWNED,
        ACTIVE·미삭제 조건을 충족하지 않으면 403 PET_NOT_ACTIVE를 반환한다.
        동시 선택·잠금 충돌 등으로 요청 상태가 변경되면
        409 CONCURRENT_UPDATE_CONFLICT를 반환한다. 이 409는 POST /pets 후속 자동
        지정의 201 RETRY_REQUIRED와 다른 수동 선택 API 오류 흐름이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId]
              properties:
                petId:
                  type: integer
                  format: int64
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Active Pet 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '403':
          description: PET_NOT_OWNED 또는 PET_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: PET_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

  /pets:
    post:
      tags: [Pet]
      summary: Pet 직접 등록
      operationId: createPet
      description: |
        owner User를 직렬화한 생성 트랜잭션에서 deleted_at IS NULL Pet 수를 조회한다.
        이 생성 트랜잭션에서 owner User 잠금·동시 수정 충돌이 발생하면 Pet을
        Commit하지 않고 409 CONCURRENT_UPDATE_CONFLICT를 반환한다.
        생성 전 수가 0이면 내부 firstPetCandidate=true로 확정하고 Pet을 Commit한다.
        생성 Commit 뒤 후보인 경우에만 별도 트랜잭션으로 Active 지정을 시도한다.
        자동 Active 지정 단계에서 비관적 잠금 실패로 분류된 동시성 오류에는 생성된
        Pet을 유지하고 201과 RETRY_REQUIRED를 반환한다. 자동 지정의 DB 연결 장애·
        무결성 오류·코딩 오류·불변조건 위반은 RETRY_REQUIRED 또는 NOT_APPLICABLE로
        숨기지 않고 원인에 맞는 오류 흐름으로 처리한다. 선행 Pet 생성이 이미
        Commit됐다면 후속 자동 Active 지정이 오류로 실패해도 생성 Pet은 유지된다.
        같은 owner의 미삭제 Pet은 SUSPENDED를 포함해 최대 5마리이며 초과 시
        409 PET_LIMIT_EXCEEDED를 반환한다.
        Pet PublicTag Unique 충돌로 총 5회 저장에 실패하면
        409 PET_PUBLIC_TAG_GENERATION_FAILED를 반환한다.
        M1은 Idempotency-Key를 제공하지 않는다. timeout·5xx 뒤에는 GET /pets/me로
        생성 여부를 확인하고 POST를 무작정 재시도하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: Pet 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCreateEnvelope'
        '409':
          description: PET_LIMIT_EXCEEDED, PET_PUBLIC_TAG_GENERATION_FAILED 또는 CONCURRENT_UPDATE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /pets/me:
    get:
      tags: [Pet]
      summary: 내 Pet 목록
      operationId: listMyPets
      description: Active Pet을 먼저, 나머지는 createdAt ASC, petId ASC로 반환한다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 내 Pet 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetListEnvelope'

  /pets/search:
    get:
      tags: [Pet, Friend]
      summary: Pet 공개 태그 검색
      operationId: searchPetByPublicTag
      description: |
        친구 요청 진입점이다. 차단 관계와 자기 소유 Pet은 결과에서 제외한다.
        publicTag의 앞뒤 공백은 Java String.strip()의
        Character.isWhitespace 기준으로 한 번 제거한 뒤 정확 일치 검색한다.
        strip 후 빈 값이거나 Unicode code point 수가 30을 초과하면
        VALIDATION_FAILED를 반환한다.
        내부 공백, 대소문자와 Unicode 구성은 변경하지 않으며,
        String.strip()이 제거하지 않는 공백 문자를 별도로 제거하지 않는다.
      parameters:
        - name: publicTag
          in: query
          required: true
          description: String.strip() 후 비어 있지 않고 Unicode code point 수가 30 이하여야 한다.
          schema:
            type: string
          example: 몽이#A7K2
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetSearchEnvelope'
              examples:
                success:
                  summary: L2 사용자의 정확 검색 성공
                  value:
                    success: true
                    message: Pet 검색이 완료되었습니다.
                    data:
                      petId: 2
                      publicTag: 몽이#A7K2
                      nickname: 몽이
                      profileUrl: null
                      verified: false
                      relationship: NONE
                    error: null
                noResult:
                  summary: 결과 없음 또는 제외 대상
                  value:
                    success: true
                    message: Pet 검색이 완료되었습니다.
                    data: null
                    error: null
                l1User:
                  summary: Active Pet이 없는 L1 사용자의 검색 성공
                  value:
                    success: true
                    message: Pet 검색이 완료되었습니다.
                    data:
                      petId: 2
                      publicTag: 몽이#A7K2
                      nickname: 몽이
                      profileUrl: null
                      verified: false
                      relationship: null
                    error: null

  /pets/{petId}/profile:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pet]
      summary: Pet 공개 프로필 조회
      operationId: getPetPublicProfile
      description: |
        로그인한 조회자가 공개 가능한 Pet의 프로필을 조회한다.
        대상 Pet은 `status=ACTIVE`, `deletedAt=null`, 소유자 계정 `ACTIVE`여야 하며,
        조회자와 대상 소유자 사이에 어느 방향으로든 Block이 있으면 존재하지 않는 것처럼
        `404 PET_NOT_FOUND`를 반환한다. 자기 Pet도 조회할 수 있으나 relationship은 null이다.
        비자기 대상에서 조회자의 Active Pet이 없으면 조회는 성공하고 relationship은 null이다.
        Active Pet이 있을 때만 기존 FriendRelationship 값(`NONE`, `REQUEST_SENT`,
        `REQUEST_RECEIVED`, `FRIEND`)을 반환한다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Pet 공개 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPublicProfileEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Pet 공개 프로필이 조회되었습니다.
                    data:
                      petId: 20
                      publicTag: pet#TAG2
                      nickname: 나나
                      profileUrl: https://storage.example/presigned...
                      verified: true
                      breedName: 푸들
                      sex: FEMALE
                      neutered: true
                      birthDate: '2023-01-01'
                      sizeCode: SMALL
                      bio: 산책을 좋아해요
                      personalityTags: [활발함, 사교적]
                      helpfulReceivedCount: 12
                      relationship: FRIEND
                    error: null
        '404':
          description: Pet이 없거나 공개 불가 상태이거나 양방향 Block 관계임 (PET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pet]
      summary: Pet 상세 조회
      operationId: getMyPet
      description: |
        본인 소유의 미삭제 Pet 전체 정보를 조회한다.
        Pet 행 존재 여부, 삭제 여부, 미삭제 Pet의 소유권 순서로 확인한다.
        Pet 행이 없거나 삭제된 Pet이면 소유권 검사보다 먼저
        404 PET_NOT_FOUND를 반환한다.
        삭제되지 않은 Pet이 존재하지만 다른 User 소유인 경우에만
        403 PET_NOT_OWNED를 반환한다.
        따라서 다른 User 소유이면서 삭제된 Pet도 404 PET_NOT_FOUND로 처리한다.
        과거 Chat 이력 표시용 내부 Pet 조회는 이 REST endpoint와 별도이며
        삭제된 Pet도 조회할 수 있다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Pet 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetEnvelope'
        '404':
          description: Pet 행 없음 또는 삭제. 소유권 검사보다 우선한다. (PET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 삭제되지 않은 다른 User 소유 Pet (PET_NOT_OWNED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Pet]
      summary: Pet 수정
      operationId: updatePet
      description: |
        인증 User가 소유한 미삭제 Pet 정보를 부분 수정한다. 현재 Active Pet이
        아니거나 SUSPENDED 상태여도 허용한다. 생략 필드는 유지하고 nullable 필드의
        명시적 null은 값을 초기화한다. nickname과 personalityTags의 null은 허용하지
        않으며 personalityTags의 빈 배열은 전체 태그를 제거한다.
        HTTP Body 없음, JSON null, 빈 객체, unknown field와 수정 불가 필드는
        VALIDATION_FAILED다. PATCH는 필드별 JSON wire 타입을 엄격하게 검사하며
        문자열·숫자·boolean 간 coercion을 하지 않는다. nullable 문자열의 textual
        value는 생성 계약과 같이 trim하거나 빈 값을 null로 바꾸지 않는다.
        Pet 행 없음 또는 삭제를 소유권보다 먼저 PET_NOT_FOUND로 처리하고, 미삭제
        타인 소유 Pet은 PET_NOT_OWNED로 처리한다. 실제 값이 같은 no-op도 200이며
        version 또는 updatedAt 갱신을 강제하지 않는다.
        현재 Verification 저장 구조가 없어 응답은 verified=false,
        verifiedAt=null이다. 향후 Verification 구현 뒤 nickname, breedName, sex,
        neutered, birthDate가 인증 스냅샷과 달라지면 같은 트랜잭션에서 배지를
        해제해야 한다. 이번 API는 신규 Flyway 또는 ERD 변경을 요구하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetEnvelope'
        '403':
          description: 미삭제 타인 소유 Pet (PET_NOT_OWNED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pet 행 없음 또는 삭제. 소유권 검사보다 우선한다. (PET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 낙관적 잠금 충돌 (CONCURRENT_UPDATE_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Pet]
      summary: Pet 삭제
      operationId: deletePet
      description: Active Pet은 삭제할 수 없다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: 삭제 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /pet-registration/attempts:
    post:
      tags: [PetVerification]
      summary: 동물 등록정보 조회
      operationId: lookupPetRegistration
      description: |
        M1 Provider는 동기 처리한다. 보호자 이름과 생년월일은 Provider 요청에만
        사용하고 저장하거나 로그에 남기지 않는다. canonical 등록번호가 없으면
        status=REJECTED로 응답하며 배지는 발급하지 않지만 직접 Pet 등록은 허용한다.
        Provider 처리 완료 후 최종 상태만 저장하며 PENDING은 DB에 저장하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetVerificationAttemptRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 조회 결과 및 일회용 적용 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetVerificationAttemptEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

  /pet-registration/attempts/{attemptId}/consume:
    post:
      tags: [PetVerification]
      summary: 조회 결과를 Pet에 적용
      operationId: consumePetRegistrationAttempt
      description: SUCCEEDED Attempt에서만 허용하며 이미 CONSUMED된 Attempt는 409를 반환한다.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId, verificationToken]
              properties:
                petId:
                  type: integer
                  format: int64
                verificationToken:
                  type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 인증 배지 적용 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /setlogs:
    get:
      tags: [Setlog]
      summary: M1 공통 시드 셋로그 3개 조회
      operationId: listSeedSetlogs
      description: L1 이상 모든 사용자에게 동일한 시드 영상 3개를 반환한다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 시드 셋로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlogListEnvelope'

  /setlogs/{setlogId}:
    get:
      tags: [Setlog]
      summary: 공유 카드용 셋로그 상세 조회
      operationId: getSetlogDetail
      description: |
        공유 카드의 detailPath(`/setlogs/{setlogId}`)로 진입할 때 현재 표시 가능 상태와
        양방향 차단 관계를 재검증한다. Media Presigned GET URL은 매 조회마다 새로 발급하며,
        응답은 `Cache-Control: no-store`다. Active Pet 미선택 L1 User도 조회할 수 있고
        이때 authorPet.relationship은 null, myReactions는 빈 배열이다.
      parameters:
        - name: setlogId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 셋로그 상세와 조회 시점에 새로 발급한 Media URL
          headers:
            Cache-Control:
              description: 접근 민감 응답의 재사용을 막기 위한 no-store 정책
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlogDetailEnvelope'
        '403':
          description: 비활성 계정 또는 저장된 Active Pet 상태 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SETLOG_NOT_FOUND. 셋로그 없음, 비공개·삭제, 재생 불가 Media, 비활성 작성자 또는 양방향 차단을 구분하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /setlogs/{setlogId}/reactions/{type}:
    parameters:
      - name: setlogId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ReactionType'
    put:
      tags: [Setlog]
      summary: 셋로그 반응 추가
      operationId: addSetlogReaction
      description: 동일 반응 추가는 멱등 처리한다. CUTE와 LIKE는 동시에 존재할 수 있다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 반응 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlogReactionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Setlog]
      summary: 셋로그 반응 취소
      operationId: removeSetlogReaction
      description: |
        같은 버튼을 다시 누르면 클라이언트가 이 API를 호출한다.
        반응이 이미 없어도 200과 reacted=false를 반환하는 멱등 API다.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 반응 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetlogReactionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /setlogs/{setlogId}/greetings:
    post:
      tags: [Greeting]
      summary: 고정 인사 전송 및 DIRECT 방 생성
      operationId: sendGreeting
      description: |
        요청 본문은 없다. 서버가 "안녕하세요! 같이 놀아요." TEXT를 저장한다.
        상대가 답변하기 전에는 추가 메시지를 보낼 수 없다.
        하루 10명 제한은 Asia/Seoul 날짜 경계로 계산한다.
      parameters:
        - name: setlogId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 인사 및 방 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /friend-requests:
    post:
      tags: [Friend]
      summary: 친구 요청
      operationId: createFriendRequest
      description: |
        Active Pet이 요청한다. 같은 방향의 유효한 PENDING은 409로 거절한다.
        반대 방향의 유효한 PENDING이 있으면 새 요청을 만들지 않고 기존 요청을
        ACCEPTED로 전이하고 Friendship과 DIRECT 방을 보장한다.
        만료 시각은 요청 시각부터 7일이며 expiresAt <= now이면 만료로 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPetId]
              properties:
                targetPetId:
                  type: integer
                  format: int64
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: PENDING 요청 생성. respondedAt과 directRoomId는 null이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestEnvelope'
        '200':
          description: |
            반대 방향의 기존 요청을 ACCEPTED로 전이하고 DIRECT 방을 보장한다.
            기존 requestId와 requester/target 방향을 유지하며 respondedAt과
            directRoomId를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /friend-requests/received:
    get:
      tags: [Friend]
      summary: 받은 친구 요청 목록
      operationId: listReceivedFriendRequests
      description: |
        현재 Active Pet이 받은 유효한 PENDING 요청만 반환한다.
        expiresAt <= now인 요청은 목록에서 제외하지만 상태를 변경하지 않는다.
        requestedAt DESC, requestId DESC cursor를 사용한다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 받은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /friend-requests/sent:
    get:
      tags: [Friend]
      summary: 보낸 친구 요청 목록
      operationId: listSentFriendRequests
      description: |
        현재 Active Pet이 보낸 유효한 PENDING 요청만 반환한다.
        expiresAt <= now인 요청은 목록에서 제외하지만 상태를 변경하지 않는다.
        requestedAt DESC, requestId DESC cursor를 사용한다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 보낸 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /friend-requests/{requestId}/accept:
    post:
      tags: [Friend]
      summary: 친구 요청 수락
      operationId: acceptFriendRequest
      description: |
        현재 Active Pet이 수신 Pet인 PENDING 요청만 수락한다. 요청자·수신자
        상태와 양방향 Block을 재검증하고 Friendship과 DIRECT 방을 같은
        트랜잭션에서 생성 또는 재사용한다. expiresAt <= now이면 요청을
        EXPIRED로 반영한 뒤 409를 반환한다. 권한이 없는 requestId는 404로
        존재를 숨긴다.
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 수락, Friendship 생성 및 DIRECT 방 보장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /friend-requests/{requestId}/reject:
    post:
      tags: [Friend]
      summary: 친구 요청 거절
      operationId: rejectFriendRequest
      description: |
        현재 Active Pet이 수신 Pet인 PENDING 요청을 REJECTED로 전이한다.
        관계 종료 작업이므로 Block·친구 수·Friendship·Chat을 조회하지 않는다.
        expiresAt <= now이면 EXPIRED로 반영한 뒤 409를 반환한다. 권한이 없는
        requestId는 404로 존재를 숨긴다.
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 거절 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /friend-requests/{requestId}:
    delete:
      tags: [Friend]
      summary: 보낸 친구 요청 취소
      operationId: cancelFriendRequest
      description: |
        현재 Active Pet이 발신 Pet인 PENDING 요청을 CANCELED로 전이한다.
        관계 종료 작업이므로 Block·친구 수·Friendship·Chat·Pet 표시 정보를
        조회하지 않는다. expiresAt <= now이면 EXPIRED로 반영한 뒤 409를
        반환한다. 권한이 없는 requestId는 404로 존재를 숨긴다.
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: 취소 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /pets/{petId}/friends:
    get:
      tags: [Friend]
      summary: Pet 친구 목록
      operationId: listPetFriends
      description: |
        인증 User가 소유한 미삭제 Pet의 친구를 최신 Friendship 순서로 반환한다.
        현재 Active Pet이 아니거나 SUSPENDED 상태여도 조회할 수 있다.
        다른 User 소유 Pet은 PET_NOT_OWNED, 없거나 삭제된 Pet은 PET_NOT_FOUND다.
      parameters:
        - $ref: '#/components/parameters/PetId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 친구 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetSearchListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{petId}/friends/{friendPetId}:
    delete:
      tags: [Friend]
      summary: 친구 삭제
      operationId: deletePetFriend
      description: |
        인증 User가 소유한 미삭제 source Pet의 Friendship만 삭제한다.
        source Pet은 현재 Active Pet일 필요가 없으며 ACTIVE 또는 SUSPENDED를 허용한다.
        source Pet이 없거나 삭제됐으면 PET_NOT_FOUND, 미삭제 타인 소유 Pet이면
        PET_NOT_OWNED, canonical pair의 Friendship이 없으면 FRIENDSHIP_NOT_FOUND다.
        target Pet은 선행 조회하지 않는다. 기존 DIRECT ChatRoom, Participant,
        Message, Greeting, FriendRequest 이력은 변경하지 않으며 기존 Chat 조건을
        충족하는 참가자는 계속 대화할 수 있다.
      parameters:
        - $ref: '#/components/parameters/PetId'
        - name: friendPetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: 친구 삭제 완료. 응답 Body 없음
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/rooms:
    get:
      tags: [Chat]
      summary: DIRECT 방 목록 폴링
      operationId: listChatRooms
      description: |
        현재 Active Pet이 Participant인 방을 lastMessageAt 내림차순으로 반환한다.
        차단 관계 방은 숨기되 증거 보존을 위해 삭제하지 않는다.
        lastMessage는 room-list용 요약으로 type과 기본 메시지 필드만 제공한다.
        IMAGE/VIDEO의 attachment와 SETLOG_SHARE의 sharedSetlog 상세 hydration은 제공하지 않는다.
        클라이언트는 type만으로 사진·동영상·셋로그 공유 텍스트 미리보기를 결정한다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 방 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /chat/rooms/{roomId}:
    get:
      tags: [Chat]
      summary: DIRECT 방 상세
      operationId: getChatRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 방 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/rooms/{roomId}/messages:
    get:
      tags: [Chat]
      summary: 새 메시지 폴링
      operationId: listChatMessages
      description: afterMessageId보다 큰 메시지를 ID 오름차순으로 반환한다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: afterMessageId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 메시지 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Chat]
      summary: typed 메시지 전송
      operationId: sendChatMessage
      description: |
        clientMessageId로 재시도 멱등성을 보장한다.
        ARCHIVED 방은 정상 메시지 저장 시 ACTIVE로 복구한다.
        사용자 전송 타입(TEXT/IMAGE/VIDEO/SETLOG_SHARE)은 모두 clientMessageId가 필요하다.
        IMAGE/VIDEO의 body는 반드시 null이며 caption은 지원하지 않는다.
        대표 오류는 VALIDATION_FAILED·CHAT_CLIENT_MESSAGE_ID_REQUIRED(400),
        ACTIVE_PET_REQUIRED(403), CHAT_ROOM_NOT_FOUND(404),
        GREETING_REPLY_REQUIRED·CHAT_DUPLICATE_MESSAGE·CHAT_MEDIA_ALREADY_ATTACHED(409)다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: 메시지 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageEnvelope'
        '200':
          description: 동일 clientMessageId의 기존 메시지 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /chat/rooms/{roomId}/card-drafts:
    post:
      tags: [MeetingCard]
      summary: AI 약속 카드 초안 생성
      operationId: createCardDraft
      description: |
        프런트는 최근 24시간 내 사용자 TEXT 메시지 2개 이상일 때 버튼을 활성화한다.
        서버는 직접 호출 또는 경쟁 조건으로 0~1개여도 거절하지 않고
        200과 fallback=true, fallbackReason=INSUFFICIENT_CONTEXT인 빈 폼을 반환한다.
        AI에는 최근 24시간 내 사용자 TEXT를 최대 30개만 전달하며 CARD와 SYSTEM은 제외한다.
        AI 실패·지연도 200 빈 폼으로 처리한다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 카드 초안 또는 빈 폼
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDraftEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meeting-cards:
    post:
      tags: [MeetingCard]
      summary: 약속 카드 확정
      operationId: createMeetingCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCardCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: 카드 및 CARD 메시지 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCardEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meeting-cards/{cardId}:
    get:
      tags: [MeetingCard]
      summary: 약속 카드 상세
      operationId: getMeetingCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 카드 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCardEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meeting-cards/{cardId}/cancel:
    post:
      tags: [MeetingCard]
      summary: 약속 카드 취소
      operationId: cancelMeetingCard
      description: 참여 Pet 양쪽 모두 취소할 수 있다.
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 취소 및 SYSTEM 메시지 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCardEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/blocks:
    post:
      tags: [Block]
      summary: User 단위 차단
      operationId: createBlock
      description: Friendship 삭제, 양방향 PENDING 요청 취소, 상호작용과 노출을 차단한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 차단 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockEnvelope'
        '200':
          description: 기존 차단 관계 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Block]
      summary: 차단 목록
      operationId: listBlocks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 차단 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /reports:
    post:
      tags: [Report]
      summary: DIRECT 방 신고
      operationId: createReport
      description: |
        신고만으로 상대를 자동 차단하지 않는다.
        동일 reporter·room에 OPEN 신고가 이미 있으면 새 행을 만들지 않고 기존 신고를 반환한다.
        중복 요청의 reasonCode와 detail은 반영하지 않고 최초 OPEN 신고 내용을 유지한다.
        reasonCode=OTHER이면 detail은 공백이 아닌 값으로 반드시 입력한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 신규 신고 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '200':
          description: 동일 reporter·room의 기존 OPEN 신고 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reports:
    get:
      tags: [Admin]
      summary: 관리자 신고 큐
      operationId: listAdminReports
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 신고 큐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportPageEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/reports/{reportId}:
    get:
      tags: [Admin]
      summary: 신고 상세 및 방 전체 대화 조회
      operationId: getAdminReport
      description: |
        조회 자체는 상태를 변경하지 않는다. 사용자용 counterpartPet 관점 DTO를 재사용하지 않고
        신고자·피신고자 User와 양쪽 Pet, 방, 전체 메시지를 관리자 전용 Evidence DTO로 반환한다.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 신고와 증거 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportDetailEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reports/{reportId}/actions:
    post:
      tags: [Admin]
      summary: 관리자 신고 처리
      operationId: resolveAdminReport
      description: |
        M1은 DISMISSED와 WARNING만 제공한다.
        DISMISSED는 NO_ACTION, WARNING은 ACTIONED로 종결한다.
        WARNING은 계정 상태를 바꾸지 않고 관리자 경고 이력만 기록한다.
        종결된 신고에는 추가 WARNING을 포함한 어떤 조치도 다시 적용할 수 없으며 409를 반환한다.
        WARNING 결과를 사용자에게 노출하는 API·알림·화면은 M1에 없다.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReportActionRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 보호 API의 인증 실패는 401 ErrorEnvelope로 반환한다.

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FriendRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 권한 또는 정책 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 상태 또는 중복 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Gone:
      description: 만료되었거나 이미 소비된 일회용 자원
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableContent:
      description: 의미적으로 처리할 수 없는 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 일일 제한 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [success, message, data, error]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    SignupRequest:
      type: object
      required: [email, password, nickname, neighborhoodCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        neighborhoodCode:
          type: string
          maxLength: 20
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    OAuthExchangeRequest:
      type: object
      required: [provider, loginCode]
      properties:
        provider:
          type: string
          enum: [GOOGLE, NAVER]
          description: runtime은 GOOGLE만 지원하며 NAVER는 400 OAUTH_PROVIDER_UNSUPPORTED다.
        loginCode:
          type: string
          minLength: 1
          maxLength: 512
    OAuthSignupRequest:
      type: object
      required: [signupToken, nickname, neighborhoodCode]
      properties:
        signupToken:
          type: string
          minLength: 1
          maxLength: 512
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        neighborhoodCode:
          type: string
          minLength: 1
          maxLength: 20
    OAuthSignupRequired:
      type: object
      required: [profileCompletionRequired, signupToken, signupTokenExpiresAt]
      properties:
        profileCompletionRequired:
          type: boolean
          const: true
        signupToken:
          type: string
        signupTokenExpiresAt:
          type: string
          format: date-time
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
    AuthTokensEnvelope:
      $ref: '#/components/schemas/EnvelopeAuthTokens'
    OAuthSignupRequiredEnvelope:
      type: object
      required: [success, message, data, error]
      properties:
        success: { type: boolean, const: true }
        message: { type: string, const: 'OAuth 가입을 위한 추가 정보 입력이 필요합니다.' }
        data: { $ref: '#/components/schemas/OAuthSignupRequired' }
        error: { type: 'null' }

    Neighborhood:
      type: object
      required: [code, sidoName, sigunguName, eupmyeondongName]
      properties:
        code:
          type: string
        sidoName:
          type: string
        sigunguName:
          type: [string, 'null']
        eupmyeondongName:
          type: [string, 'null']

    Me:
      type: object
      required: [userId, email, nickname, publicTag, role, accountStatus, accessLevel, neighborhoodCode, activePetId]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nickname:
          type: string
        publicTag:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        accountStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, WITHDRAWN]
        accessLevel:
          type: string
          enum: [L1, L2]
        neighborhoodCode:
          type: string
        activePetId:
          type: [integer, 'null']
          format: int64

    PetCreateRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          description: >-
            앞뒤 공백 제거 후 저장하며, 이모지 및 emoji-like pictographic
            문자·기호(예: ©, ™, ☀, ♥)는 사용할 수 없다.
        breedName:
          type: [string, 'null']
          maxLength: 100
          description: 사용자 입력 또는 향후 동물등록 조회의 kindNm을 반영할 수 있는 견종명
        sex:
          $ref: '#/components/schemas/NullablePetSex'
        neutered:
          type: [boolean, 'null']
        birthDate:
          type: [string, 'null']
          format: date
        weightKg:
          type: [number, 'null']
          minimum: 0
          maximum: 999.99
          multipleOf: 0.01
        sizeCode:
          type: [string, 'null']
          enum: [SMALL, MEDIUM, LARGE, null]
        bio:
          type: [string, 'null']
          maxLength: 500
        personalityTags:
          type: array
          maxItems: 10
          items:
            type: string
        careNote:
          type: [string, 'null']
          maxLength: 500
    PetUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        필드 생략은 기존 값 유지, nullable 필드의 null은 초기화를 의미한다.
        nickname과 personalityTags는 null을 허용하지 않으며 personalityTags의
        빈 배열은 전체 제거다. minProperties는 정적 표현이며 런타임 parser가
        지원 필드 presence와 unknown field를 다시 검사한다.
        생성 API의 값 정규화 정책을 유지하지만 PATCH JSON field는 schema의 실제
        wire 타입만 허용하며 scalar coercion을 하지 않는다.
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          description: >-
            앞뒤 공백 제거 후 저장하며, 이모지 및 emoji-like pictographic
            문자·기호(예: ©, ™, ☀, ♥)는 사용할 수 없다. null은 허용하지 않는다.
        breedName:
          type: [string, 'null']
          maxLength: 100
          description: >-
            사용자 입력 또는 향후 동물등록 조회의 kindNm을 반영할 수 있는 견종명.
            textual value는 trim하지 않고 빈 문자열과 공백 문자열도 그대로 저장한다.
        sex:
          $ref: '#/components/schemas/NullablePetSex'
        neutered:
          type: [boolean, 'null']
        birthDate:
          type: [string, 'null']
          format: date
        weightKg:
          type: [number, 'null']
          minimum: 0
          maximum: 999.99
          multipleOf: 0.01
        sizeCode:
          type: [string, 'null']
          enum: [SMALL, MEDIUM, LARGE, null]
        bio:
          type: [string, 'null']
          maxLength: 500
          description: textual value는 trim하거나 빈 문자열을 null로 바꾸지 않는다.
        personalityTags:
          type: array
          maxItems: 10
          description: >-
            null은 허용하지 않는다. 빈 배열은 전체 제거이며 요소를 trim, 정렬,
            중복 제거하지 않는다.
          items:
            type: string
        careNote:
          type: [string, 'null']
          maxLength: 500
          description: textual value는 trim하거나 빈 문자열을 null로 바꾸지 않는다.
    NullablePetSex:
      type: [string, 'null']
      enum: [MALE, FEMALE, UNKNOWN, null]
    Pet:
      type: object
      required: [petId, ownerUserId, publicTag, nickname, status, deletedAt, verified, active, helpfulReceivedCount]
      properties:
        petId:
          type: integer
          format: int64
        ownerUserId:
          type: integer
          format: int64
        publicTag:
          type: string
          maxLength: 30
          pattern: '^.{1,25}#[A-Z0-9]{4}$'
          description: User와 별도 Namespace. trim한 nickname 앞 25개 Unicode code point와 #XXXX로 생성한다.
        ownerPublicTag:
          type: string
        nickname:
          type: string
          minLength: 1
        breedName:
          type: [string, 'null']
          description: 사용자 입력 또는 향후 동물등록 조회의 kindNm을 반영할 수 있는 견종명
        sex:
          $ref: '#/components/schemas/NullablePetSex'
        neutered:
          type: [boolean, 'null']
        birthDate:
          type: [string, 'null']
          format: date
        weightKg:
          type: [number, 'null']
        sizeCode:
          type: [string, 'null']
          enum: [SMALL, MEDIUM, LARGE, null]
        bio:
          type: [string, 'null']
        personalityTags:
          type: array
          items:
            type: string
        careNote:
          type: [string, 'null']
        profileUrl:
          type: [string, 'null']
