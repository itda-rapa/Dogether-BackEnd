      type: object
      required: [success, message, data, error]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/Me' }
        error: { type: 'null' }
    PetEnvelope:
      type: object
      required: [success, message, data, error]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/Pet' }
        error: { type: 'null' }
    PetPublicProfileEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, error]
      properties:
        success: { type: boolean, const: true }
        message: { type: string, const: 'Pet 공개 프로필이 조회되었습니다.' }
        data: { $ref: '#/components/schemas/PetPublicProfile' }
        error: { type: 'null' }
    PetCreateResult:
      type: object
      required: [pet, activeAssignmentStatus]
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        activeAssignmentStatus:
          type: string
          enum: [ASSIGNED, RETRY_REQUIRED, NOT_APPLICABLE]
          description: |
            firstPetCandidate=true이고 자동 지정에 성공하면 ASSIGNED,
            후보지만 자동 지정 단계에서 비관적 잠금 실패로 분류된 동시성 오류면
            RETRY_REQUIRED,
            firstPetCandidate=false이거나 이미 Active Pet이 있으면 NOT_APPLICABLE이다.
            DB 장애·무결성 오류·코딩 오류는 RETRY_REQUIRED로 숨기지 않는다.
            firstPetCandidate 자체는 외부 응답에 노출하지 않는다.
