        likeCount:
          type: integer
          minimum: 0
        myReactions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReactionType'
        canInteract:
          type: boolean
          description: L2, 자기 소유 아님, 차단 관계 아님일 때 true
        createdAt:
          type: string
          format: date-time
    SetlogReaction:
      type: object
      required: [setlogId, type, reacted, cuteCount, likeCount]
      properties:
        setlogId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/ReactionType'
        reacted:
          type: boolean
        cuteCount:
          type: integer
        likeCount:
          type: integer

    Greeting:
      type: object
      required: [greetingId, roomId, status, fixedMessage, expiresAt, createdAt]
      properties:
