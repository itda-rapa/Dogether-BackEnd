        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FriendRequest:
      type: object
      required:
        - requestId
        - requesterPet
        - targetPet
        - status
        - requestedAt
        - respondedAt
        - expiresAt
        - directRoomId
      properties:
        requestId:
          type: integer
          format: int64
        requesterPet:
          $ref: '#/components/schemas/PetSearchItem'
        targetPet:
          $ref: '#/components/schemas/PetSearchItem'
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELED, EXPIRED]
        requestedAt:
          type: string
          format: date-time
        respondedAt:
          type: [string, 'null']
          format: date-time
          description: ACCEPTED·REJECTED·CANCELED 전이 시각. PENDING·EXPIRED는 null
        expiresAt:
          type: string
          format: date-time
          description: 요청 시각부터 7일. expiresAt <= now이면 만료
        directRoomId:
          type: [integer, 'null']
          format: int64
          description: ACCEPTED 상태이면 생성 또는 재사용한 DIRECT 방 ID

    ChatRoom:
      type: object
      required: [roomId, status, counterpartPet, canSend, lastMessageAt, updatedAt]
      properties:
        roomId:
          type: integer
          format: int64
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        origin:
          type: string
          enum: [GREETING, FRIEND, BOARD_COMMENT, OPEN_CHAT]
        counterpartPet:
          $ref: '#/components/schemas/PetSearchItem'
        canSend:
          type: boolean
          description: >
            M1 구현은 방 상태만 본다. ACTIVE 또는 ARCHIVED면 true이며
            인사 답변 대기는 반영하지 않는다.
        sendBlockedReason:
          type: [string, 'null']
          enum: [GREETING_REPLY_REQUIRED, BLOCKED_USER, ACCOUNT_NOT_ACTIVE, null]
          description: >
            M1 구현은 항상 null을 반환한다. enum 값은 예약이며 클라이언트는
            이 필드로 전송 가능 여부를 판단하지 않는다.
        lastMessage:
          description: >-
            room-list용 요약. type과 기본 메시지 필드만 제공하며 IMAGE/VIDEO의 attachment와
            SETLOG_SHARE의 sharedSetlog는 null이다. 클라이언트는 type만으로 텍스트 미리보기를
            결정하고, 상세 hydration은 메시지 목록 API에서 제공한다.
          oneOf:
            - $ref: '#/components/schemas/ChatMessage'
            - type: 'null'
        lastMessageAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatMessageCreateRequest:
      type: object
      required: [clientMessageId]
      properties:
        clientMessageId:
          type: string
          maxLength: 64
        type:
          type: string
          enum: [TEXT, IMAGE, VIDEO, SETLOG_SHARE]
          description: >-
            사용자 전송 타입. CARD/SYSTEM은 서버 전용이다. TEXT의 하위 호환으로 생략 가능하며,
            생략 시 body만 허용하는 legacy TEXT 요청으로 정규화된다.
            IMAGE/VIDEO/SETLOG_SHARE는 type이 필수다.
        body:
          type: [string, 'null']
          maxLength: 2000
          description: TEXT에서만 필수. IMAGE/VIDEO는 반드시 null이며 caption은 지원하지 않는다. SETLOG_SHARE도 null.
        mediaId:
          type: [integer, 'null']
          format: int64
          description: IMAGE/VIDEO에서 필수.
        setlogId:
          type: [integer, 'null']
          format: int64
          description: SETLOG_SHARE에서 필수.
    ChatMessage:
      type: object
      required: [messageId, roomId, senderType, senderPetNickname, type, createdAt]
      properties:
        messageId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        senderType:
          type: string
          enum: [PET, SYSTEM]
        senderPetId:
          type: [integer, 'null']
          format: int64
        senderPetNickname:
          type: [string, 'null']
          description: 발신 펫의 현재 이름. SYSTEM 메시지는 null
        type:
          type: string
          enum: [TEXT, CARD, IMAGE, VIDEO, SETLOG_SHARE, SYSTEM]
        body:
          type: [string, 'null']
        attachment:
          oneOf:
            - $ref: '#/components/schemas/ChatMessageAttachment'
            - type: 'null'
        sharedSetlog:
          oneOf:
            - $ref: '#/components/schemas/SharedSetlog'
            - type: 'null'
        meetingCardId:
          type: [integer, 'null']
          format: int64
        clientMessageId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

