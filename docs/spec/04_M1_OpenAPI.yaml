          type: [string, 'null']
        fileSize:
          type: [integer, 'null']
          format: int64
        url:
          type: [string, 'null']
          description: 응답 시점에 발급한 Presigned URL. DB에 저장하지 않는다. 접근 불가 media는 null.
        expiresAt:
          type: [string, 'null']
          format: date-time

