          description: M1 사용자 등록 Pet은 null이며 클라이언트가 기본 이미지를 표시한다.
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
          description: DELETED이면 deletedAt이 필수이며 ACTIVE/SUSPENDED이면 deletedAt은 null이다.
        deletedAt:
          type: [string, 'null']
          format: date-time
        verified:
          type: boolean
        verifiedAt:
          type: [string, 'null']
          format: date-time
        active:
          type: boolean
        helpfulReceivedCount:
          type: integer
          format: int64
          minimum: 0
          description: 삭제되지 않은 게시글과 댓글이 받은 HELPFUL 반응의 합계. LIKE, 차단 관계, 반응 Pet의 이후 상태는 포함 판단에 사용하지 않는다.
    PetPublicProfile:
      type: object
      additionalProperties: false
      required: [petId, publicTag, nickname, profileUrl, verified, breedName, sex, neutered, birthDate, sizeCode, bio, personalityTags, helpfulReceivedCount, relationship]
      properties:
        petId:
          type: integer
          format: int64
        publicTag:
          type: string
          maxLength: 30
          pattern: '^.{1,25}#[A-Z0-9]{4}$'
        nickname:
          type: string
          minLength: 1
        profileUrl:
          type: [string, 'null']
          format: uri
          description: 연결된 profile Media를 조회 시점에 signing한 URL이며, profileAsset이 없으면 null이다.
        verified:
          type: boolean
        breedName:
          type: [string, 'null']
        sex:
          $ref: '#/components/schemas/NullablePetSex'
        neutered:
          type: [boolean, 'null']
        birthDate:
          type: [string, 'null']
          format: date
        sizeCode:
          type: [string, 'null']
          enum: [SMALL, MEDIUM, LARGE, null]
        bio:
          type: [string, 'null']
        personalityTags:
          type: array
          items:
            type: string
          description: 빈 배열을 포함해 항상 배열로 반환한다.
        helpfulReceivedCount:
          type: integer
          format: int64
          minimum: 0
          description: 기존 HELPFUL 집계 기준을 그대로 사용한다.
        relationship:
          type: [string, 'null']
          enum: [NONE, REQUEST_SENT, REQUEST_RECEIVED, FRIEND, null]
          description: 자기 Pet 또는 조회자의 Active Pet이 없으면 null이다.
    PetSearchItem:
      type: object
      required: [petId, publicTag, nickname, verified, relationship]
      properties:
        petId:
          type: integer
          format: int64
        publicTag:
          type: string
          maxLength: 30
          pattern: '^.{1,25}#[A-Z0-9]{4}$'
          description: Pet 공개 태그
        nickname:
          type: string
          minLength: 1
        profileUrl:
          type: [string, 'null']
          format: uri
          description: M1은 null이며 클라이언트가 기본 이미지를 표시한다.
        verified:
          type: boolean
        relationship:
          type: [string, 'null']
          enum: [NONE, REQUEST_SENT, REQUEST_RECEIVED, FRIEND, null]
          description: Active Pet이 없는 L1은 null

    PetVerificationAttemptRequest:
      type: object
