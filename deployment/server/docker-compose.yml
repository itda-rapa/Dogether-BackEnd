services:
  app:
    image: ghcr.io/itda-rapa/dogether-backend:latest
    container_name: dogether-backend
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    stop_grace_period: 30s
    networks:
      - dogether-network


  ai:
    image: ghcr.io/itda-rapa/dogether-ai:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - dogether-network

  consumer:
    image: ghcr.io/itda-rapa/dogether-backend-consumer:latest
    container_name: dogether-consumer
    env_file:
      - .env
    ports:
      - "${CONSUMER_SERVER_PORT:-8081}:8081"
    stop_grace_period: 30s
    networks:
      - dogether-network

networks:
  dogether-network:
    driver: bridge