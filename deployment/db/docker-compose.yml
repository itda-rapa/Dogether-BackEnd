services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: dogether-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dogether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dogether-network

  rustfs:
    image: ${RUSTFS_IMAGE}
    container_name: dogether_rustfs
    env_file:
      - .env
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dogether-rustfs-data:/data
      - dogether-rustfs-logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dogether-network

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - dogether-redis-data:/data
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dogether-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - dogether-network

networks:
  dogether-network:
    driver: bridge
volumes:
  dogether-redis-data:
  dogether-postgres-data:
  dogether-rustfs-data:
  dogether-rustfs-logs:
